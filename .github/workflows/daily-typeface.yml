name: Daily Typeface

on:
  schedule:
    # 14:05 UTC = 9:05am Toronto in winter, 10:05am in summer. GitHub often
    # starts scheduled runs late (sometimes by hours), so this is the earliest
    # it will post, not the exact time. One schedule = one post per day.
    - cron: "5 14 * * *"
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Post typeface of the day
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python bot.py
