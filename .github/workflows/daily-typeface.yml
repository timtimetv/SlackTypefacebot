name: Daily Typeface

on:
  schedule:
    # 9:00am America/Toronto is 13:00 UTC in summer (EDT) and 14:00 UTC in winter (EST).
    # Both run; bot.py only posts from the one that lands in the 9am local hour.
    - cron: "0 13 * * *"
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Post right now, ignoring the 9am check"
        type: boolean
        default: true

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Post typeface of the day
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            python bot.py --force
          else
            python bot.py
          fi
